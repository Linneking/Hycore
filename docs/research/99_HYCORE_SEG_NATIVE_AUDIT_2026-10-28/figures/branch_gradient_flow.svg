   <g id="text_1">
    <text style="fill: #ab433f; font: 12px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(145.1931 239.852625)">CE梯度</text>
    <text style="fill: #ab433f; font: 12px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(138.117788 254.88)">更新φ与θ</text>
   </g>
   <g id="text_2">
    <text style="fill: #ab433f; font: 12px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(963.4944 239.852625)">正则梯度</text>
    <text style="fill: #ab433f; font: 12px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(943.106588 254.88)">更新θ，不经过φ</text>
   </g>
   <g id="text_3">
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="576" y="126.164922" transform="rotate(-0 576 126.164922)">点云 X_i：N个点</text>
   </g>
   <g id="text_4">
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(521.012031 194.757535)">共享 backbone Eθ</text>
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(469.374609 212.635277)">输出 H_i [N,F]，batch堆叠为 [B,N,F]</text>
   </g>
   <g id="text_5">
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(207.575859 324.918922)">分割分支：exp → 双曲分割头 Cφ</text>
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(239.897109 342.254828)">每点类别分数 [B,N,50]</text>
   </g>
   <g id="text_6">
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(740.738516 324.623324)">正则分支：每物体内部取平均 → exp</text>
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(743.773203 342.550426)">whole用全部点，part用特征近邻点</text>
   </g>
   <g id="text_7">
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(272.826719 460.069703)">只计算 LCE</text>
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(246.78 477.330453)">监督：逐点部件标签</text>
   </g>
   <g id="text_8">
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(749.638438 460.266734)">只计算 Lreg = αRcontr + βRhier</text>
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(799.798125 477.602641)">该分支不加入CE</text>
   </g>
   <g id="text_9">
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(484.072734 589.886031)">训练入口：Ltotal = LCE + Lreg</text>
    <text style="fill: #182b3a; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(486.34875 607.221937)">统一backward；CE只计入一次</text>
   </g>
  </g>
  <g id="text_10">
   <text style="fill: #172a3a; font: 700 23px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="576" y="37.237344" transform="rotate(-0 576 37.237344)">HyCoRe-seg：两分支单独计算损失，训练入口只合并一次</text>
  </g>
  <g id="text_11">
   <text style="fill: #465566; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="576" y="54" transform="rotate(-0 576 54)">正则分支无CE；共享backbone接收CE与正则梯度，独立分割头只接收CE梯度。</text>
  </g>
  <g id="text_12">
   <text style="fill: #465566; font: 12px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="576" y="694.8" transform="rotate(-0 576 694.8)">实线：前向计算 / 损失汇合    ·    红色虚线：反向梯度路径    ·    正则不得对共享H做detach</text>
  </g>
 </g>
