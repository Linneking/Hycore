   <g id="text_2">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="565.496471" y="202.914548" transform="rotate(-0 565.496471 202.914548)">XYZ 输入 [B,N,3]</text>
   </g>
   <g id="text_3">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(449.003627 276.623969)">DGCNN分割前端：STN + 三阶段局部编码</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(461.729752 292.822519)">局部64 / 64 / 64，拼接为 L [B,N,192]</text>
   </g>
   <g id="text_4">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(499.266674 358.432665)">原 conv6：192 → 1024</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(503.880752 374.631215)">逐点特征 T [B,N,1024]</text>
   </g>
   <g id="text_5">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(464.675861 440.24136)">全局max1024 + 类别编码64 = 1088</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(475.529096 456.43991)">拼接后广播到N个点：[B,N,1088]</text>
   </g>
   <g id="text_6">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(484.535174 522.050056)">保留广播特征与局部L192拼接</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(457.989689 538.248606)">1024全局 + 64类别 + 192局部 = 1280</text>
   </g>
   <g id="text_7">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(468.766674 603.546079)">保留欧氏融合 conv8：1280 → 256</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(451.76483 620.369974)">保留BN8 / 激活 / dp1，得到 H [B,N,256]</text>
   </g>
   <g id="text_8">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="565.496471" y="693.986894" transform="rotate(-0 565.496471 693.986894)">原 expmap0：逐点256维映入双曲球</text>
   </g>
   <g id="text_9">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(459.159174 759.233947)">同维替换三个映射为官方 MobiusLayer</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(474.186142 775.503028)">256→256；256→128；128→50</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(467.843096 792.311483)">完整保留 _weight / _bias / transp0</text>
   </g>
   <g id="text_10">
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(486.99233 868.415161)">逐点部件分数 [B,N,50] → CE</text>
    <text style="fill: #182b3a; font: 12.2px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(429.531283 885.239056)">头内BN9/10、激活、dp2拟按HyCoRe风格不保留</text>
   </g>
   <g id="text_11">
    <text style="fill: #182b3a; font: 10.8px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(968.580612 418.654234)">类别one-hot16</text>
    <text style="fill: #182b3a; font: 10.8px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(969.327331 432.993934)">原conv7 / BN7</text>
    <text style="fill: #182b3a; font: 10.8px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(985.382206 447.333634)">16 → 64</text>
    <text style="fill: #182b3a; font: 10.8px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(985.044706 461.673334)">类别编码</text>
   </g>
   <g id="text_12">
    <text style="fill: #182b3a; font: 11px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(984.644706 582.293093)">正则入口</text>
    <text style="fill: #182b3a; font: 11px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(979.315722 596.898343)">H_i[N,256]</text>
    <text style="fill: #182b3a; font: 11px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(970.067128 611.751523)">取feature part</text>
    <text style="fill: #182b3a; font: 11px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(973.764159 626.356773)">mean → exp</text>
    <text style="fill: #182b3a; font: 11px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif" transform="translate(979.144706 640.962023)">只算两正则</text>
   </g>
  </g>
  <g id="text_13">
   <text style="fill: #172a3a; font: 700 23px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="576" y="43.585625" transform="rotate(-0 576 43.585625)">实验三：保留DGCNN广播融合，后三层同维双曲替换</text>
  </g>
  <g id="text_14">
   <text style="fill: #465566; font: 13px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="576" y="65.52" transform="rotate(-0 576 65.52)">第三组恢复原类别one-hot分支与1280融合；三层Möbius仍复用HyCoRe官方类及初始化。</text>
  </g>
  <g id="text_15">
   <text style="fill: #465566; font: 12px 'Microsoft YaHei', 'SimHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="576" y="982.8" transform="rotate(-0 576 982.8)">三层不含前面的欧氏融合投影；此组为分割结构参照，尚未实现或训练。</text>
  </g>
